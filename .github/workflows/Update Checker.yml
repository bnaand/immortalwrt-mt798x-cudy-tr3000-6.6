
name: Update Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */5 * *"

permissions:
  contents: read
  actions: write

jobs:
  check-upstream:
    runs-on: ubuntu-24.04

    steps:
      # 1. 获取上游指定分支的最新提交
      - name: Get upstream commit
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          UPSTREAM_REPO="padavanonly/immortalwrt-mt798x-6.6"
          UPSTREAM_BRANCH="openwrt-24.10-6.6"

          COMMIT_HASH=$(gh api \
            "repos/${UPSTREAM_REPO}/commits/${UPSTREAM_BRANCH}" \
            --jq '.sha')

          if [ -z "$COMMIT_HASH" ] || [ "$COMMIT_HASH" = "null" ]; then
            echo "ERROR: 无法获取上游提交记录"
            exit 1
          fi

          echo "commit_hash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
          echo "上游仓库：$UPSTREAM_REPO"
          echo "上游分支：$UPSTREAM_BRANCH"
          echo "最新提交：$COMMIT_HASH"

      # 2. 读取之前记录的上游提交
      - name: Restore previous commit
        uses: actions/cache@v5
        with:
          path: .upstream-hash
          key: upstream-hash-${{ steps.upstream.outputs.commit_hash }}
          restore-keys: |
            upstream-hash-

      # 3. 比较提交记录，判断是否有更新
      - name: Compare commits
        id: compare
        env:
          CURRENT_HASH: ${{ steps.upstream.outputs.commit_hash }}
        run: |
          set -euo pipefail

          PREVIOUS_HASH=""

          if [ -f .upstream-hash ]; then
            PREVIOUS_HASH=$(cat .upstream-hash)
          fi

          echo "之前记录：${PREVIOUS_HASH:-无}"
          echo "当前提交：$CURRENT_HASH"

          if [ -z "$PREVIOUS_HASH" ]; then
            echo "首次运行：记录当前版本，不自动触发编译"
            echo "updated=false" >> "$GITHUB_OUTPUT"

          elif [ "$PREVIOUS_HASH" = "$CURRENT_HASH" ]; then
            echo "上游没有更新，结束检查"
            echo "updated=false" >> "$GITHUB_OUTPUT"

          else
            echo "检测到上游更新！"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

          printf '%s\n' "$CURRENT_HASH" > .upstream-hash

      # 4. 只有检测到新提交时，才触发固件编译
      - name: Trigger firmware build
        if: steps.compare.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_WORKFLOW: Build Cudy TR3000 ImmortalWrt 24.10-6.6.yml
        run: |
          set -euo pipefail

          echo "检测到上游更新，开始触发固件编译"

          gh workflow run "$BUILD_WORKFLOW" \
            --ref main \
            --repo "$GITHUB_REPOSITORY"

          echo "已提交固件编译任务"
